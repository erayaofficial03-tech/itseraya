name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Mondays at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run npm audit (high severity and above)
        run: |
          # Fail the build on high or critical vulnerabilities.
          # Use npm here because `bun audit` is not yet stable across versions.
          npx --yes better-npm-audit audit --level high

      - name: Full audit report (informational)
        if: always()
        run: npm audit --audit-level=low || true

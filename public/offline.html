<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eraya — Offline</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #FAF8F5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
      color: #2C2C2C;
    }
    img { height: 48px; margin-bottom: 24px; }
    h1 { color: #C9A84C; font-size: 24px; margin: 0 0 8px; font-weight: 500; }
    p { color: #9A8F85; font-size: 15px; line-height: 1.6; margin: 0; }
    button {
      margin-top: 24px;
      background: #C9A84C;
      color: #2C2C2C;
      border: none;
      padding: 10px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="/eraya-logo.png" alt="Eraya" onerror="this.style.display='none'" />
  <h1>You're offline</h1>
  <p>Please check your connection.<br>Your wishlist and browsing history are saved.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>

    <script>
      // Aggressive eviction: unregister every service worker and wipe Cache
      // Storage on every page load. One-time hard reload (guarded by
      // localStorage 'eraya_cache_cleared_v3') ensures returning browsers
      // controlled by a stale SW get a fresh HTML from the network.
      (function(){
        try {
          if (!('serviceWorker' in navigator)) return;
          var RELOAD_KEY = 'eraya_cache_cleared_v3';
          var ops = [];
          ops.push(
            navigator.serviceWorker.getRegistrations().then(function(rs){
              return Promise.all(rs.map(function(r){ return r.unregister(); }));
            }).catch(function(){})
          );
          if (window.caches) {
            ops.push(
              caches.keys().then(function(ks){
                return Promise.all(ks.map(function(k){ return caches.delete(k); }));
              }).catch(function(){})
            );
          }
          Promise.all(ops).then(function(){
            try {
              if (!localStorage.getItem(RELOAD_KEY)) {
                localStorage.setItem(RELOAD_KEY, '1');
                location.reload();
              }
            } catch (e) {}
          });
        } catch (e) { /* noop */ }
      })();
    </script>
